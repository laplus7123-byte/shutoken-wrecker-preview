<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 720" role="img" aria-labelledby="title desc">
<title id="title">野田市を拠点とした対応エリアの概念図</title>
<desc id="desc">野田拠点からつくば、小山、古河、守谷へ。春日部を含む埼玉県内の対応は電話で確認。位置と距離は概略です。</desc>
<defs>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#e8e4e3" stroke-width="1"/></pattern>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#153c2e" flood-opacity=".1"/></filter>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10Z" fill="#247962"/></marker>
</defs>
<rect width="800" height="720" rx="28" fill="#faf7f5"/>
<rect x="20" y="20" width="760" height="680" rx="20" fill="url(#grid)"/>
<g font-family="'Noto Sans JP','Hiragino Sans',sans-serif">
  <text x="400" y="54" text-anchor="middle" font-size="20" font-weight="700" letter-spacing="3" fill="#1f6e5b">SERVICE AREA</text>
  <text x="400" y="98" text-anchor="middle" font-size="34" font-weight="900" fill="#242126">野田から30km圏へ</text>
  <circle cx="370" cy="370" r="220" fill="#1f6e5b" fill-opacity=".045" stroke="#8bb6a6" stroke-width="2" stroke-dasharray="8 8"/>
  <circle cx="370" cy="370" r="140" fill="none" stroke="#b9d7c9" stroke-width="1" stroke-dasharray="5 8"/>
  <g stroke="#e4dfda" fill="none" stroke-width="14" stroke-linecap="round">
    <path d="M65 268Q240 290 330 190T670 160"/>
    <path d="M158 585Q310 458 487 502T738 559"/>
    <path d="M240 137Q285 322 231 418T278 607"/>
    <path d="M690 258Q491 314 525 577"/>
  </g>
  <g font-size="22" font-weight="700" fill="#aaa3a2">
    <text x="110" y="165">栃木方面</text><text x="633" y="237">茨城方面</text>
    <text x="594" y="590">千葉北西部</text><text x="50" y="400">埼玉方面</text>
  </g>
  <g fill="none" stroke="#247962" stroke-width="5" marker-end="url(#arrow)">
    <path d="M356 324Q333 254 317 216"/>
    <path d="M331 341Q295 307 272 287"/>
    <path d="M412 344Q500 290 571 280"/>
    <path d="M412 403Q482 430 555 464"/>
  </g>
  <path d="M327 407Q275 447 214 479" fill="none" stroke="#999293" stroke-width="4" stroke-dasharray="8 8"/>
  <g fill="#fff" stroke="#dbe8e2" filter="url(#shadow)">
    <rect x="253" y="148" width="126" height="62" rx="16"/>
    <rect x="169" y="222" width="126" height="62" rx="16"/>
    <rect x="570" y="245" width="160" height="66" rx="16"/>
    <rect x="549" y="463" width="126" height="62" rx="16"/>
    <rect x="85" y="476" width="174" height="91" rx="16"/>
  </g>
  <g fill="#29252a" font-size="30" font-weight="900" text-anchor="middle">
    <text x="316" y="191">小山</text><text x="232" y="265">古河</text>
    <text x="650" y="289">つくば</text><text x="612" y="506">守谷</text>
    <text x="172" y="516">春日部</text>
  </g>
  <text x="172" y="547" fill="#756e70" text-anchor="middle" font-size="17" font-weight="700">対応は電話で確認</text>
  <circle cx="370" cy="370" r="66" fill="#1f6e5b" stroke="#fff" stroke-width="8" filter="url(#shadow)"/>
  <path d="M340 350L370 328 400 350V360H340Z" fill="#fff"/>
  <path d="M345 360H395V383H381V367H359V383H345Z" fill="#fff"/>
  <text x="370" y="409" font-size="23" font-weight="900" text-anchor="middle" fill="#fff">野田拠点</text>
  <rect x="273" y="445" width="194" height="36" rx="18" fill="#fff" stroke="#c6dfd4"/>
  <text x="370" y="470" fill="#0f4a3c" text-anchor="middle" font-size="19" font-weight="700">野田市古布内114</text>
  <rect x="55" y="613" width="690" height="72" rx="14" fill="#fff"/>
  <text x="400" y="643" fill="#51464a" text-anchor="middle" font-size="18">※位置・距離は概略です。対応エリアのイメージ図です。</text>
  <text x="400" y="669" fill="#51464a" text-anchor="middle" font-size="18">出動可否・到着時間はお電話でご確認ください。</text>
</g>
</svg>
